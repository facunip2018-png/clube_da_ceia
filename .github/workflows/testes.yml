name: Testes do aplicativo

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Atualizar lockfile quando package.json divergir
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Registrar lockfile sincronizado no branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sincroniza package-lock"
            git push
          fi
      - name: Instalar dependências
        run: npm ci
      - name: Gerar SQL consolidado e dados derivados
        run: npm run content:build
      - name: Registrar arquivos gerados no branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- supabase/seed.sql supabase/setup_completo.sql src/server/demo-data.generated.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/seed.sql supabase/setup_completo.sql src/server/demo-data.generated.json
            git commit -m "chore: atualiza arquivos derivados"
            git push
          fi
      - name: Conferir conteúdo gerado
        run: npm run content:check
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Executar testes automatizados
        run: npm test
